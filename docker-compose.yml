version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    ports: 
      - "11434:11434"
    volumes: 
      - ollama-storage:/root/.ollama  # Permanent storage on your Mac

  ollama-initializer:
    image: ollama/ollama:latest
    volumes:
      - ollama-storage:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434  # Tells the CLI exactly where the server lives
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command: -c "ollama list | grep -q 'llama3.2' && echo 'Model already loaded!' || ollama pull llama3.2"

  app:
    build: .
    ports: 
      - "8000:8000"
    environment:
      MINIPLAT_OLLAMA_BASE_URL: "http://ollama:11434"
      MINIPLAT_CHAT_MODEL: "llama3.2"
    depends_on:
      ollama-initializer:
        condition: service_completed_successfully # Waits until the initializer finishes checking

volumes:
  ollama-storage: # This creates the physical, permanent directory on your MacBook
