name: miniplat
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]   # vectors persist here across restarts

  app:
    build: .
    environment:
      MINIPLAT_OLLAMA_BASE_URL: http://ollama:11434
      MINIPLAT_QDRANT_URL: http://qdrant:6333
      # Offer more models in the UI (pull them in Ollama first):
      MINIPLAT_EMBED_MODELS: nomic-embed-text
      MINIPLAT_CHAT_MODELS: llama3.2:3b
    ports: ["8000:8000"]
    depends_on: [ollama, qdrant]

  ui:
    build: .
    command: ["python", "-m", "miniplat.ui"]
    environment:
      MINIPLAT_BACKEND_URL: http://app:8000
    ports: ["7860:7860"]
    depends_on: [app]

volumes:
  ollama: {}
  qdrant: {}
